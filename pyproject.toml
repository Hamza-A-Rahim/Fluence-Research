[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fluence"
version = "0.1.0"
description = "Research code for detecting and classifying speech disfluencies (stuttering events)."
readme = "README.md"
requires-python = ">=3.10"
# Core: kept deliberately small. Versions are lower bounds; the exact
# environment used for each experiment is recorded in its experiment log.
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
# Optional: used only to cross-check our feature extraction.
audio-extras = ["librosa>=0.10", "soundfile>=0.12"]
# Bundles an ffmpeg binary so scripts/fetch_sep28k.py works without a system install.
fetch = ["imageio-ffmpeg>=0.5"]
# Stage 4. Install PyTorch first from https://download.pytorch.org (see docs/setup_windows.md).
deep = ["transformers>=4.40"]
# Stage 7 local demo API (backend/). httpx is only for its tests.
web = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9", "imageio-ffmpeg>=0.5", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]   # tests work before `pip install -e .`; tests share helpers
